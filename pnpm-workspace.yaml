# pnpm reads non-auth settings from here, not from .npmrc (only auth and
# registry settings are read from .npmrc since pnpm v11). Without these
# approvals, CI fails with ERR_PNPM_IGNORED_BUILDS on Linux.
allowBuilds:
  esbuild: true
  unrs-resolver: true
  # Downloads the Electron binary for `pnpm desktop:*` and the smoke test.
  electron: true
  # msw's postinstall only copies a browser service worker; the tests use
  # msw/node, so its build script is denied on purpose.
  msw: false
# electron-builder's dependency tree otherwise pulls glob 7, whose deprecation
# notice in pnpm-lock.yaml carries a personal email the leak guard rejects.
# @electron/asar 4 uses a current glob; the Windows installer (squirrel) is
# never built here (macOS only, SPEC §1.3).
overrides:
  "@electron/asar": 4.3.1
  electron-builder-squirrel-windows: "-"
