name: checks

# The full checks run once per change: on pull requests and on main. They are
# not in ci.yml because a branch push would report them as skipped on the
# pull request's head commit, and a skipped job counts as a passing check.
# The job names `ci` and `desktop` are the required status checks: keep them.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the running one pointless.
concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # The schema and the migrations must agree: `drizzle-kit check` verifies
      # the migration history, and generating from the schema must produce
      # nothing (no missing migration, no stray file).
      - name: Migration drift
        run: |
          pnpm exec drizzle-kit check
          pnpm db:generate
          git diff --exit-code drizzle/
          test -z "$(git status --porcelain drizzle/)"
      # Database tests run on in-memory PGlite: no Postgres service needed.
      - run: pnpm test
      # The production build needs no credentials.
      - run: pnpm build
      # Only Chromium runs (playwright.config.ts), so only Chromium is installed.
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi
      # The e2e servers run `next dev`: the test-only identity is compiled out
      # of production builds on purpose (lib/e2e-bypass.ts), so `next start`
      # has no user for the specs.
      # One project per run, so one dev server at a time: the three together
      # need more memory than the runner has (playwright.config.ts). A runner
      # that runs out of memory dies without a message, so the log keeps a
      # memory line per minute. Every project runs, also after a failure.
      - name: pnpm test:e2e
        env:
          # `next dev` restarts itself at 80 % of its heap limit, which it sets
          # to half the RAM (so at 6.4 GB here), and a restart mid-run drops
          # the mocked data and the warmed routes. The mocked server ends the
          # run at 7.9 GB resident; alone on the runner it can have 12 GB.
          NODE_OPTIONS: --max-old-space-size=12288
        run: |
          (while sleep 60; do
            echo "[memory] $(free -m | awk '/Mem:/{printf "used %s MB, available %s MB, ", $3, $7} /Swap:/{printf "swap %s MB", $3}'), largest process $(ps -eo rss=,comm= --sort=-rss | awk 'NR==1{printf "%d MB (%s)", $1/1024, $2}')"
          done) &
          memory=$!
          failed=0
          for project in mocks e2e-db mocks-settings; do
            E2E_PROJECT=$project pnpm test:e2e || failed=1
          done
          kill $memory
          exit $failed
      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The desktop app (SPEC D2): the unsigned universal .dmg builds, and the
  # packaged app passes the Electron smoke test.
  desktop:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm desktop:build
      - run: pnpm test:desktop
      - name: Upload the Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-traces
          path: test-results/
          retention-days: 7
