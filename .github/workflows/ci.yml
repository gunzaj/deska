name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the running one pointless.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on every push to every branch, before anything is installed.
  leak-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/leak-guard.mjs --all

  # The full checks run once per change: on pull requests and on main. A push
  # to a branch with an open pull request would otherwise run them twice.
  ci:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # The schema and the migrations must agree: `drizzle-kit check` verifies
      # the migration history, and generating from the schema must produce
      # nothing (no missing migration, no stray file).
      - name: Migration drift
        run: |
          pnpm exec drizzle-kit check
          pnpm db:generate
          git diff --exit-code drizzle/
          test -z "$(git status --porcelain drizzle/)"
      # Database tests run on in-memory PGlite: no Postgres service needed.
      - run: pnpm test
      # The production build needs no credentials.
      - run: pnpm build
      # Only Chromium runs (playwright.config.ts), so only Chromium is installed.
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi
      # The e2e servers run `next dev`: the test-only identity is compiled out
      # of production builds on purpose (lib/e2e-bypass.ts), so `next start`
      # has no user for the specs.
      - run: pnpm test:e2e
      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The desktop app (SPEC D2): the unsigned universal .dmg builds, and the
  # packaged app passes the Electron smoke test.
  desktop:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm desktop:build
      - run: pnpm test:desktop
      - name: Upload the Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-traces
          path: test-results/
          retention-days: 7
