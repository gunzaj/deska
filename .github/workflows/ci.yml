name: ci

# The leak guard runs on every push to every branch, so a pull request's head
# commit has exactly one `leak-guard` check (a `pull_request` trigger would add
# a second). The full checks (`ci` and `desktop`) live in checks.yml, which
# runs only on pull requests and main, so a branch push never reports them as
# skipped. The job name `leak-guard` is a required status check: keep it.
on:
  push:

permissions:
  contents: read

# A newer push to the same branch makes the running one pointless.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on every push to every branch, before anything is installed.
  leak-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/leak-guard.mjs --all
