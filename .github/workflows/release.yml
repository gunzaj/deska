name: release

# A `v*` tag builds the unsigned universal .dmg and attaches it to a DRAFT
# release. Nothing is published: the maintainer reviews and publishes it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: node scripts/leak-guard.mjs --all
      - run: pnpm install --frozen-lockfile
      - name: The tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # Unit and database tests run before the dmg is built, and the desktop
      # smoke runs against the writes-on build that ships (it reads the build's
      # write switch, so the same spec covers CI's writes-off build).
      # DESKA_WRITES is set on the build and smoke steps only: the unit tests
      # run on the fixture store, which refuses to start with writes on.
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm desktop:build
        env:
          # From v1.1.0 the build allows GitHub writes (SPEC §3.4 part 3). The
          # token's permissions and Settings → GitHub writes (off by default)
          # still have to allow them.
          DESKA_WRITES: "on"
      - run: pnpm test:desktop
        env:
          # Lets the smoke check that the packaged app really is the writes-on build.
          DESKA_WRITES: "on"
      - name: Draft release with the .dmg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/release-notes-${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || notes=docs/release-notes.md
          gh release create "$GITHUB_REF_NAME" release/*.dmg --draft --verify-tag --title "Deska ${GITHUB_REF_NAME#v}" --notes-file "$notes"
